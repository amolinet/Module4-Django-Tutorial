{% extends 'blog/base.html' %}

{% block content %}
    <div class="post">
        {% if post.published_date %}
            <div class="date">
                {{ post.published_date }}
            </div>
        {% else %}
            <aside class="actions">
                <a class="btn btn-secondary" role="button" href="{% url 'post_publish' pk=post.pk %}">Publish</a>
            </aside>
        {% endif %}

        {% if user.is_authenticated %}
            <aside class="actions">
                <a class="btn btn-secondary" role="button" href="{% url 'post_edit' pk=post.pk %}">Edit</a>
                <a class="btn btn-secondary" href="{% url 'post_remove' pk=post.pk %}">
    {% include './icons/trash-fill.svg' %}
    </a>
            </aside>
        {% endif %}

        <h2>{{ post.title }}</h2>
        <p>{{ post.text|linebreaksbr }}</p>
    </div>
{% endblock %}
